<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — InstaClone</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #fafafa; display: flex; align-items: center;
           justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #fff; border: 1px solid #dbdbdb; border-radius: 8px;
            padding: 40px 32px; width: 100%; max-width: 360px; text-align: center; }
    .logo { font-size: 32px; font-weight: bold;
            font-family: 'Brush Script MT', cursive, sans-serif; margin-bottom: 24px; }
    .field { width: 100%; padding: 10px 12px; margin-bottom: 10px;
             background: #fafafa; border: 1px solid #dbdbdb; border-radius: 4px;
             font-size: 14px; outline: none; }
    .field:focus { border-color: #a8a8a8; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px;
           background: #0095f6; color: #fff; font-weight: 600; font-size: 14px;
           cursor: pointer; margin-top: 8px; }
    .btn:hover { background: #0077c8; }
    .error { color: #ed4956; font-size: 13px; margin-top: 10px; min-height: 18px; }
    .switch { font-size: 13px; margin-top: 16px; color: #8e8e8e; }
    .switch a { color: #0095f6; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

<div class="card">
    <div class="logo">Instagram</div>
    <input type="text"     id="username" class="field" placeholder="Имя пользователя">
    <input type="password" id="password" class="field" placeholder="Пароль">
    <button class="btn" id="registerBtn">Зарегистрироваться</button>
    <div class="error" id="error"></div>
    <div class="switch">Уже есть аккаунт? <a href="login.html">Войти</a></div>
</div>

<script>
    const usersKey = 'instaclone_users';

    document.getElementById('registerBtn').addEventListener('click', () => {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorEl  = document.getElementById('error');
        errorEl.textContent = '';

        if (username.length < 3) {
            errorEl.textContent = 'Имя пользователя должно быть не короче 3 символов';
            return;
        }
        if (password.length < 4) {
            errorEl.textContent = 'Пароль должен быть не короче 4 символов';
            return;
        }

        const users = JSON.parse(localStorage.getItem(usersKey) || '{}');
        if (users[username]) {
            errorEl.textContent = 'Такое имя уже занято';
            return;
        }

        users[username] = { password };
        localStorage.setItem(usersKey, JSON.stringify(users));

        // Автоматический вход после регистрации
        localStorage.setItem('instaclone_current_user', username);
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
